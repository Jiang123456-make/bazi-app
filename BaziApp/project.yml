# XcodeGen 配置文件
# 在 Mac 上安装 XcodeGen 后，在 BaziApp 目录执行：xcodegen generate
# 即可一键生成 BaziApp.xcodeproj（无需手动新建工程拖源码）
name: BaziApp
options:
  bundleIdPrefix: com.lingxi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""          # 填入你的 Apple 开发者 Team ID（可选）
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    TARGETED_DEVICE_FAMILY: "1"
targets:
  BaziApp:
    type: application
    platform: iOS
    sources:
      - path: BaziApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingxi.bazi
        INFOPLIST_KEY_CFBundleDisplayName: 灵犀
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 无需访问相册
