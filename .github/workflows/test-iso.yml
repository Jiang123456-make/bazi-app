name: Build & Upload to TestFlight

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号'
        required: true
        default: '1.0.0'
      build_number:
        description: '构建号'
        required: true
        default: '1'

env:
  TEAM_ID: ${{ secrets.TEAM_ID }}
  PROFILE_NAME: ${{ secrets.PROFILE_NAME }}
  APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
  APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}

jobs:
  build-and-upload:
    name: Build & Upload
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Echo
        run: echo "header test works"
