name: Build & Upload to TestFlight

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    name: Build & Upload
    runs-on: macos-latest

    steps:
      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        working-directory: BaziApp
        run: xcodegen generate
