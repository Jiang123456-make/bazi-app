name: Build & Upload to TestFlight

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    name: Build & Upload
    runs-on: macos-latest

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 上传构建产物作为 Artifact（备用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BaziApp-ipa
          path: BaziApp/build/*.ipa
          retention-days: 7
