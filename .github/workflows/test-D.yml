name: Build & Upload to TestFlight

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号'
        required: true
        default: '1.0.0'
      build_number:
        description: '构建号'
        required: true
        default: '1'

jobs:
  build-and-upload:
    name: Build & Upload
    runs-on: macos-latest

    steps:
      - name: 解码并安装描述文件 (.mobileprovision)
        run: |
          echo "${{ secrets.MOBILEPROVISION_BASE64 }}" | base64 --decode > profile.mobileprovision
          security cms -D -i profile.mobileprovision > profile.plist
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" profile.plist)
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "已安装描述文件: $PROFILE_UUID"

      - name: 准备 App Store Connect API Key
        run: echo "${{ secrets.APPSTORE_API_KEY_BASE64 }}" | base64 --decode > BaziApp/api_key.p8

      - name: 安装 Fastlane 依赖
        working-directory: BaziApp
        run: bundle install

      - name: 构建并上传 TestFlight
        working-directory: BaziApp
        env:
          VERSION: ${{ github.event.inputs.version }}
          BUILD_NUMBER: ${{ github.event.inputs.build_number }}
        run: bundle exec fastlane beta
