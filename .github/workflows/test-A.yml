name: Build & Upload to TestFlight

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号'
        required: true
        default: '1.0.0'
      build_number:
        description: '构建号'
        required: true
        default: '1'

env:
  TEAM_ID: ${{ secrets.TEAM_ID }}
  PROFILE_NAME: ${{ secrets.PROFILE_NAME }}
  APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
  APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}

jobs:
  build-and-upload:
    name: Build & Upload
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        working-directory: BaziApp
        run: xcodegen generate

      - name: 解码分发证书 (.p12)
        run: echo "${{ secrets.P12_BASE64 }}" | base64 --decode > distribution.p12

      - name: 创建临时钥匙串并导入证书
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import distribution.p12 -k "$KEYCHAIN_PATH" -P "${{ secrets.P12_PASSWORD }}" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: 解码并安装描述文件 (.mobileprovision)
        run: |
          echo "${{ secrets.MOBILEPROVISION_BASE64 }}" | base64 --decode > profile.mobileprovision
          security cms -D -i profile.mobileprovision > profile.plist
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" profile.plist)
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "已安装描述文件: $PROFILE_UUID"

      - name: 准备 App Store Connect API Key
        run: echo "${{ secrets.APPSTORE_API_KEY_BASE64 }}" | base64 --decode > BaziApp/api_key.p8

      - name: 安装 Fastlane 依赖
        working-directory: BaziApp
        run: bundle install

      - name: 构建并上传 TestFlight
        working-directory: BaziApp
        env:
          VERSION: ${{ github.event.inputs.version }}
          BUILD_NUMBER: ${{ github.event.inputs.build_number }}
        run: bundle exec fastlane beta
